name: Sync NTIS Notices

on:
  schedule:
    # 매일 한국 시간(KST) 오전 08:00 실행 (UTC 기준 전날 23:00)
    - cron: '0 23 * * *'
  # GitHub 웹 화면에서 언제든 'Run workflow' 버튼으로 수동 실행 가능
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 런타임 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NTIS 공고 정기 수집 스크립트 실행
        env:
          NTIS_API_KEY: ${{ secrets.NTIS_API_KEY || '40r92e211t7p461hvbqd' }}
          NTIS_USER_ID: ${{ secrets.NTIS_USER_ID || 'cwsjames1' }}
        run: |
          node scripts/fetch-notices.mjs

      - name: 변경된 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/notices.json
          
          # 변경사항이 있을 때만 커밋 수행
          if git diff --staged --quiet; then
            echo "새로운 변경사항이 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "Auto sync: Update notices.json [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push origin main
          fi